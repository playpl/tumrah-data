# Records off the owner's PC (owner, 2026-11-17/18: slow, limited internet; no heavy transfers on the PC).
# Every 2 hours: Telegram download -> AAC mono 48 kbps -> the site's private storage (R2). State in R2 (cloud/state.py).
# Year 2 first (the PC's to-do list, cloud/year2.py), then year 1 (the mother maps).
name: Records

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      max_mb:
        description: "MB to download from Telegram in this run (each year)"
        default: "3000"
      warp:
        description: "Route through Cloudflare WARP (true/false; on, the live log stays blank)"
        default: "false"
      connections:
        description: "Telegram connections per file (0 = one connection, blocks as in 'parallel')"
        default: "8"
      parallel:
        description: "With connections 0: blocks of one file fetched at once"
        default: "4"

concurrency:
  group: telegram-records          # never two Telegram readers at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"            # without it the step log stays empty until the run ends
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      MAX_MB: ${{ github.event.inputs.max_mb || '3000' }}
      PARALLEL: ${{ github.event.inputs.parallel || '4' }}
      CONNECTIONS: ${{ github.event.inputs.connections || '8' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Python packages
        run: |
          pip install -q -r cloud/requirements.txt
          python -c "import cryptg, telethon; print('cryptg', cryptg.__version__ if hasattr(cryptg, '__version__') else 'ok', '- telethon', telethon.__version__)"
      - name: Cloudflare WARP
        if: ${{ github.event.inputs.warp == 'true' }}    # run #3: with WARP on, the step log showed no line
        continue-on-error: true
        timeout-minutes: 5
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new && warp-cli --accept-tos mode warp && warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          warp-cli --accept-tos status
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep warp=
      - name: Year 2
        continue-on-error: true
        run: python -u -m cloud.records --year 2 --max-mb "$MAX_MB" --max-minutes 30 --parallel "$PARALLEL" --connections "$CONNECTIONS"
      - name: Year 1
        run: python -u -m cloud.records --year 1 --max-mb "$MAX_MB" --max-minutes 90 --parallel "$PARALLEL" --connections "$CONNECTIONS"
