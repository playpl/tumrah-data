# Year 1 records off the owner's PC (owner, 2026-11-17: slow, limited internet; the PC is not always on).
# Every 2 hours: Telegram download -> AAC mono 48 kbps -> the site's private storage (R2). State in R2 (cloud/state.py).
name: Year 1 records

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      max_mb:
        description: "MB to download from Telegram in this run"
        default: "3000"

concurrency:
  group: telegram-records          # never two Telegram readers at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"            # without it the step log stays empty until the run ends
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Python packages
        run: pip install -q -r cloud/requirements.txt
      - name: Download, compress, upload
        run: python -u -m cloud.records --max-mb "${{ github.event.inputs.max_mb || '3000' }}"
